<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amiga AGA Launcher</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #efeae0;
        font-family: system-ui, sans-serif;
      }

      #game {
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: #050606;
        color: #86e6bd;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="status">Load an Amiga AGA file to start PUAE</div>

    <script>
      const statusElement = document.getElementById("status");
      const gameElement = document.getElementById("game");

      let pendingGame = null;
      let pendingKickstart = null;
      let started = false;
      let joystickMask = 0;
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      const diskSlots = Array.from({ length: 4 }, () => null);
      let diskSlotExtension = "adf";
      let wrappedDiskSet = false;

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function fileFromBytes(fileName, bytes, fallbackType = "application/octet-stream") {
        const lowerName = (fileName || "").toLowerCase();
        const type = lowerName.endsWith(".uae") ? "text/plain" : fallbackType;
        return new File([bytes], fileName || "amiga-file.bin", { type });
      }

      function fileExtension(fileName) {
        const match = /\.([a-z0-9]+)$/i.exec(fileName || "");
        return match ? match[1].toLowerCase() : "";
      }

      function isFloppyDiskFile(fileName) {
        return ["adf", "adz", "dms"].includes(fileExtension(fileName));
      }

      function diskSlotFileName(index) {
        return `osg-aga-disk-${index + 1}.${diskSlotExtension}`;
      }

      function diskLabel(index) {
        return diskSlots[index]?.fileName || `Disk ${index + 1}`;
      }

      function buildDiskM3u() {
        return diskSlots
          .map((_, index) => `/${diskSlotFileName(index)}|${diskLabel(index)}`)
          .join("\n");
      }

      function makeCrcTable() {
        const table = [];

        for (let i = 0; i < 256; i += 1) {
          let crc = i;
          for (let j = 0; j < 8; j += 1) {
            crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
          }
          table[i] = crc >>> 0;
        }

        return table;
      }

      const crcTable = makeCrcTable();

      function crc32(bytes) {
        let crc = 0xffffffff;

        for (let i = 0; i < bytes.length; i += 1) {
          crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
        }

        return (crc ^ 0xffffffff) >>> 0;
      }

      function writeUint16(target, offset, value) {
        target[offset] = value & 0xff;
        target[offset + 1] = (value >>> 8) & 0xff;
      }

      function writeUint32(target, offset, value) {
        target[offset] = value & 0xff;
        target[offset + 1] = (value >>> 8) & 0xff;
        target[offset + 2] = (value >>> 16) & 0xff;
        target[offset + 3] = (value >>> 24) & 0xff;
      }

      function createStoredZip(entries) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        entries.forEach((entry) => {
          const nameBytes = encoder.encode(entry.name);
          const dataBytes = entry.bytes instanceof Uint8Array ? entry.bytes : encoder.encode(entry.bytes || "");
          const crc = crc32(dataBytes);
          const local = new Uint8Array(30 + nameBytes.length);

          writeUint32(local, 0, 0x04034b50);
          writeUint16(local, 4, 20);
          writeUint16(local, 6, 0);
          writeUint16(local, 8, 0);
          writeUint16(local, 10, 0);
          writeUint16(local, 12, 0);
          writeUint32(local, 14, crc);
          writeUint32(local, 18, dataBytes.length);
          writeUint32(local, 22, dataBytes.length);
          writeUint16(local, 26, nameBytes.length);
          writeUint16(local, 28, 0);
          local.set(nameBytes, 30);
          localParts.push(local, dataBytes);

          const central = new Uint8Array(46 + nameBytes.length);
          writeUint32(central, 0, 0x02014b50);
          writeUint16(central, 4, 20);
          writeUint16(central, 6, 20);
          writeUint16(central, 8, 0);
          writeUint16(central, 10, 0);
          writeUint16(central, 12, 0);
          writeUint16(central, 14, 0);
          writeUint32(central, 16, crc);
          writeUint32(central, 20, dataBytes.length);
          writeUint32(central, 24, dataBytes.length);
          writeUint16(central, 28, nameBytes.length);
          writeUint16(central, 30, 0);
          writeUint16(central, 32, 0);
          writeUint16(central, 34, 0);
          writeUint16(central, 36, 0);
          writeUint32(central, 38, 0);
          writeUint32(central, 42, offset);
          central.set(nameBytes, 46);
          centralParts.push(central);

          offset += local.length + dataBytes.length;
        });

        const centralOffset = offset;
        const centralSize = centralParts.reduce((total, part) => total + part.length, 0);
        const eocd = new Uint8Array(22);
        writeUint32(eocd, 0, 0x06054b50);
        writeUint16(eocd, 8, entries.length);
        writeUint16(eocd, 10, entries.length);
        writeUint32(eocd, 12, centralSize);
        writeUint32(eocd, 16, centralOffset);

        return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
      }

      function createDiskSetFile(fileName, bytes) {
        diskSlotExtension = fileExtension(fileName) || "adf";
        diskSlots.fill(null);
        diskSlots[0] = {
          fileName: fileName || `Disk 1.${diskSlotExtension}`,
          bytes,
        };

        const emptyDisk = new Uint8Array(0);
        const entries = [
          { name: "osg-aga-disks.m3u", bytes: buildDiskM3u() },
          ...diskSlots.map((slot, index) => ({
            name: diskSlotFileName(index),
            bytes: slot?.bytes || emptyDisk,
          })),
        ];

        return new File([createStoredZip(entries)], "osg-aga-disks.zip", { type: "application/zip" });
      }

      function puaeKickstartName(fileName) {
        const lowerName = (fileName || "").toLowerCase();

        if (lowerName.includes("a1200") || lowerName.includes("40.68") || lowerName.includes("3.1")) {
          return "kick40068.A1200";
        }

        return fileName || "kick.rom";
      }

      function simulateInput(player, button, value) {
        const manager = window.EJS_emulator?.gameManager;

        if (!manager || !window.EJS_emulator?.started) return;

        manager.simulateInput(player, button, value);
      }

      function getEmulatorTarget() {
        return (
          window.EJS_emulator?.canvas ||
          window.EJS_emulator?.game ||
          window.EJS_emulator?.elements?.parent ||
          gameElement
        );
      }

      function dispatchMouseEvent(type, button = 0, buttons = 0, movementX = 0, movementY = 0) {
        const target = getEmulatorTarget();

        mouseX = Math.max(0, Math.min(window.innerWidth, mouseX + movementX));
        mouseY = Math.max(0, Math.min(window.innerHeight, mouseY + movementY));

        const event = new MouseEvent(type, {
          bubbles: true,
          cancelable: true,
          button,
          buttons,
          clientX: mouseX || window.innerWidth / 2,
          clientY: mouseY || window.innerHeight / 2,
          movementX,
          movementY,
        });

        Object.defineProperty(event, "movementX", { get: () => movementX });
        Object.defineProperty(event, "movementY", { get: () => movementY });

        target?.dispatchEvent(event);
        if (target !== document) {
          document.dispatchEvent(event);
        }
      }

      function applyJoystickMask(mask) {
        joystickMask = mask || 0;

        simulateInput(0, 4, joystickMask & 1 ? 1 : 0);
        simulateInput(0, 5, joystickMask & 2 ? 1 : 0);
        simulateInput(0, 6, joystickMask & 4 ? 1 : 0);
        simulateInput(0, 7, joystickMask & 8 ? 1 : 0);
        simulateInput(0, 0, joystickMask & 16 ? 1 : 0);
        simulateInput(0, 8, joystickMask & 32 ? 1 : 0);
        simulateInput(0, 3, joystickMask & 64 ? 1 : 0);
      }

      function pulseInput(button) {
        simulateInput(0, button, 1);
        window.setTimeout(() => {
          simulateInput(0, button, 0);
        }, 80);
      }

      function applyMouseButton(button, action) {
        const isRight = button === 3;
        const inputButton = isRight ? 8 : 0;
        const domButton = isRight ? 2 : 0;
        const domButtons = isRight ? 2 : 1;

        if (action === "down") {
          simulateInput(0, inputButton, 1);
          dispatchMouseEvent("mousedown", domButton, domButtons);
          return;
        }

        if (action === "up") {
          simulateInput(0, inputButton, 0);
          dispatchMouseEvent("mouseup", domButton, 0);
          dispatchMouseEvent("click", domButton, 0);
          return;
        }

        pulseInput(inputButton);
        dispatchMouseEvent("mousedown", domButton, domButtons);
        window.setTimeout(() => {
          dispatchMouseEvent("mouseup", domButton, 0);
          dispatchMouseEvent("click", domButton, 0);
        }, 80);
      }

      function applyMouseMove(dx, dy) {
        const movementX = Math.max(-80, Math.min(80, Number(dx) || 0));
        const movementY = Math.max(-80, Math.min(80, Number(dy) || 0));

        if (!movementX && !movementY) return;

        dispatchMouseEvent("mousemove", 0, 0, movementX, movementY);

        const xIndex = movementX > 0 ? 16 : 17;
        const yIndex = movementY > 0 ? 18 : 19;
        const xValue = Math.min(0x7fff, Math.abs(movementX) * 1200);
        const yValue = Math.min(0x7fff, Math.abs(movementY) * 1200);

        if (movementX) {
          simulateInput(0, xIndex, xValue);
          simulateInput(0, movementX > 0 ? 17 : 16, 0);
        }

        if (movementY) {
          simulateInput(0, yIndex, yValue);
          simulateInput(0, movementY > 0 ? 19 : 18, 0);
        }

        window.setTimeout(() => {
          simulateInput(0, 16, 0);
          simulateInput(0, 17, 0);
          simulateInput(0, 18, 0);
          simulateInput(0, 19, 0);
        }, 16);
      }

      function keyEventType(action) {
        return action === "up" ? "keyup" : "keydown";
      }

      function keyCodeFor(code, key) {
        if (code === "ArrowUp") return 38;
        if (code === "ArrowDown") return 40;
        if (code === "ArrowLeft") return 37;
        if (code === "ArrowRight") return 39;
        if (code === "Enter") return 13;
        if (code === "Space") return 32;
        if (code === "Tab") return 9;
        if (code?.startsWith("Key")) return code.charCodeAt(3);
        if (code?.startsWith("Digit")) return code.charCodeAt(5);
        if (key && key.length === 1) return key.toUpperCase().charCodeAt(0);
        return 0;
      }

      function dispatchKeyboardInput(code, key, action) {
        if (!code) return;

        const type = keyEventType(action);
        const keyCode = keyCodeFor(code, key);
        const eventInit = {
          key: key || (code.startsWith("Key") ? code.slice(3).toLowerCase() : code),
          code,
          keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true,
        };
        const target = window.EJS_emulator?.elements?.parent || gameElement;
        const targetEvent = new KeyboardEvent(type, eventInit);
        const documentEvent = new KeyboardEvent(type, eventInit);

        Object.defineProperty(targetEvent, "keyCode", { get: () => keyCode });
        Object.defineProperty(targetEvent, "which", { get: () => keyCode });
        Object.defineProperty(documentEvent, "keyCode", { get: () => keyCode });
        Object.defineProperty(documentEvent, "which", { get: () => keyCode });

        target.focus?.();
        target.dispatchEvent(targetEvent);
        document.dispatchEvent(documentEvent);
      }

      function startEmulator() {
        if (started) return;

        if (!pendingGame) {
          setStatus("Choose an Amiga AGA file first");
          return;
        }

        started = true;
        statusElement.style.display = "none";
        gameElement.innerHTML = "";

        wrappedDiskSet = isFloppyDiskFile(pendingGame.fileName);
        const gameFile = wrappedDiskSet
          ? createDiskSetFile(pendingGame.fileName, pendingGame.bytes)
          : fileFromBytes(pendingGame.fileName, pendingGame.bytes);
        const biosFile = pendingKickstart
          ? fileFromBytes(puaeKickstartName(pendingKickstart.fileName), pendingKickstart.bytes)
          : "";

        window.EJS_player = "#game";
        window.EJS_core = "puae";
        window.EJS_gameName = pendingGame.fileName || "Amiga AGA";
        window.EJS_gameUrl = gameFile;
        window.EJS_biosUrl = biosFile;
        window.EJS_pathtodata = "/emulatorjs/data/";
        window.EJS_DEBUG_XX = true;
        window.EJS_startOnLoaded = true;
        window.EJS_disableAutoLang = true;
        window.EJS_threads = false;
        window.EJS_defaultOptions = {
          "puae_model": "A1200",
          "puae_chipset": "AGA",
          "puae_cpu_model": "68020",
          "puae_chipmem_size": "4",
          "puae_fastmem_size": "8",
        };

        const script = document.createElement("script");
        script.src = "/emulatorjs/data/loader.js";
        document.body.appendChild(script);
      }

      function slotFromFileName(fileName) {
        const match = /(?:disk|disc|side|df)\s*0?([1-4])|[\W_]0?([1-4])[\W_]/i.exec(fileName || "");
        const diskNumber = Number(match?.[1] || match?.[2]);

        if (diskNumber >= 1 && diskNumber <= diskSlots.length) {
          return diskNumber - 1;
        }

        const emptySlot = diskSlots.findIndex((slot, index) => index > 0 && !slot);
        return emptySlot === -1 ? 1 : emptySlot;
      }

      function swapRunningDisk(fileName, bytes) {
        if (!wrappedDiskSet || !window.EJS_emulator?.started) {
          setStatus("Start a floppy disk image before swapping disks");
          return;
        }

        const slot = slotFromFileName(fileName);
        const diskBytes = new Uint8Array(bytes || []);
        diskSlots[slot] = {
          fileName: fileName || `Disk ${slot + 1}.${diskSlotExtension}`,
          bytes: diskBytes,
        };

        const manager = window.EJS_emulator.gameManager;
        manager.FS.writeFile(`/${diskSlotFileName(slot)}`, diskBytes);
        manager.FS.writeFile("/osg-aga-disks.m3u", new TextEncoder().encode(buildDiskM3u()));
        manager.setCurrentDisk(slot);
        window.EJS_emulator.displayMessage?.(`Inserted ${diskLabel(slot)}`, 2500);
      }

      window.getAmigaAgaAudioStream = () => null;

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data || {};

        if (data.type === "amiga_aga_start") {
          startEmulator();
        }

        if (data.type === "amiga_aga_autoload") {
          pendingGame = {
            fileName: data.fileName || "game.uae",
            bytes: new Uint8Array(data.bytes || []),
          };
          setStatus(`Starting ${pendingGame.fileName} with PUAE...`);
          startEmulator();
        }

        if (data.type === "amiga_swap_disk" || data.type === "amiga_aga_swap_disk") {
          swapRunningDisk(data.fileName, data.bytes);
        }

        if (data.type === "amiga_kickstart") {
          pendingKickstart = {
            fileName: data.fileName || "kick.rom",
            bytes: new Uint8Array(data.bytes || []),
          };
          setStatus(`Kickstart ready: ${pendingKickstart.fileName}`);
        }

        if (data.type === "amiga_aga_reset") {
          window.location.reload();
        }

        if (data.type === "amstrad_remote_joystick" || data.type === "joystick") {
          applyJoystickMask(Number(data.mask) || 0);
        }

        if (data.type === "amiga_mouse_button") {
          applyMouseButton(data.button, data.action);
        }

        if (data.type === "amiga_mouse_move") {
          applyMouseMove(data.movementX, data.movementY);
        }

        if (data.type === "amiga_keyboard") {
          dispatchKeyboardInput(data.code, data.key, data.action);
        }
      });
    </script>
  </body>
</html>
