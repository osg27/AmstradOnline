<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amiga AGA Launcher</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #efeae0;
        font-family: system-ui, sans-serif;
      }

      #game {
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: #050606;
        color: #86e6bd;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="status">Load an Amiga AGA file to start PUAE</div>

    <script>
      const statusElement = document.getElementById("status");
      const gameElement = document.getElementById("game");

      let pendingGame = null;
      let pendingDisks = [];
      let pendingKickstart = null;
      let started = false;
      let fileObjectUrls = [];
      let crcTable = null;
      let joystickMask = 0;
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      const PUAE_SYSTEM_DIRS = [
        "/home/web_user/retroarch/userdata/system",
        "/home/web_user/.config/retroarch/system",
        "/system",
      ];

      function setStatus(message) {
        statusElement.textContent = message;
      }

      function fileFromBytes(fileName, bytes, fallbackType = "application/octet-stream") {
        const lowerName = (fileName || "").toLowerCase();
        const type = lowerName.endsWith(".uae") ? "text/plain" : fallbackType;
        return new File([bytes], fileName || "amiga-file.bin", { type });
      }

      function puaeKickstartName(fileName) {
        const lowerName = (fileName || "").toLowerCase();

        if (lowerName.includes("a1200") || lowerName.includes("40.68") || lowerName.includes("3.1")) {
          return "kick40068.A1200";
        }

        return fileName || "kick.rom";
      }

      function safeVirtualFileName(fileName, fallbackName) {
        const cleanedName = (fileName || fallbackName).replace(/[\\/]/g, "_").trim();
        return cleanedName || fallbackName;
      }

      function extensionForFileName(fileName, fallbackExtension = "adf") {
        const match = (fileName || "").toLowerCase().match(/\.([a-z0-9]+)$/);
        return match ? match[1] : fallbackExtension;
      }

      function crc32(bytes) {
        if (!crcTable) {
          crcTable = Array.from({ length: 256 }, (_, index) => {
            let crc = index;
            for (let bit = 0; bit < 8; bit += 1) {
              crc = (crc & 1) ? (0xedb88320 ^ (crc >>> 1)) : (crc >>> 1);
            }
            return crc >>> 0;
          });
        }

        let crc = 0xffffffff;
        for (let index = 0; index < bytes.length; index += 1) {
          crc = crcTable[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      function writeUint16(output, value) {
        output.push(value & 0xff, (value >>> 8) & 0xff);
      }

      function writeUint32(output, value) {
        output.push(value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff);
      }

      function appendBytes(output, bytes) {
        for (let index = 0; index < bytes.length; index += 1) {
          output.push(bytes[index]);
        }
      }

      function buildZipFile(entries, fileName) {
        const output = [];
        const centralDirectory = [];
        const encoder = new TextEncoder();

        entries.forEach((entry) => {
          const nameBytes = encoder.encode(entry.fileName);
          const data = entry.bytes;
          const checksum = crc32(data);
          const offset = output.length;

          writeUint32(output, 0x04034b50);
          writeUint16(output, 20);
          writeUint16(output, 0);
          writeUint16(output, 0);
          writeUint16(output, 0);
          writeUint16(output, 0);
          writeUint32(output, checksum);
          writeUint32(output, data.length);
          writeUint32(output, data.length);
          writeUint16(output, nameBytes.length);
          writeUint16(output, 0);
          appendBytes(output, nameBytes);
          appendBytes(output, data);

          writeUint32(centralDirectory, 0x02014b50);
          writeUint16(centralDirectory, 20);
          writeUint16(centralDirectory, 20);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint32(centralDirectory, checksum);
          writeUint32(centralDirectory, data.length);
          writeUint32(centralDirectory, data.length);
          writeUint16(centralDirectory, nameBytes.length);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint16(centralDirectory, 0);
          writeUint32(centralDirectory, 0);
          writeUint32(centralDirectory, offset);
          appendBytes(centralDirectory, nameBytes);
        });

        const centralDirectoryOffset = output.length;
        output.push(...centralDirectory);
        writeUint32(output, 0x06054b50);
        writeUint16(output, 0);
        writeUint16(output, 0);
        writeUint16(output, entries.length);
        writeUint16(output, entries.length);
        writeUint32(output, centralDirectory.length);
        writeUint32(output, centralDirectoryOffset);
        writeUint16(output, 0);

        return new File([new Uint8Array(output)], fileName, { type: "application/zip" });
      }

      function createTrackedObjectUrl(file) {
        const objectUrl = URL.createObjectURL(file);
        fileObjectUrls.push(objectUrl);
        return objectUrl;
      }

      function clearObjectUrls() {
        fileObjectUrls.forEach((objectUrl) => URL.revokeObjectURL(objectUrl));
        fileObjectUrls = [];
      }

      function buildPuaeConfigFile(gameFileName, kickstartFileName) {
        const config = [
          "config_description=OldStyleGaming Amiga AGA",
          "config_hardware=true",
          "config_host=true",
          "amiga_model=A1200",
          "chipset=aga",
          "cpu_type=68ec020",
          "cpu_speed=real",
          "chipmem_size=4",
          "fastmem_size=8",
          "bogomem_size=0",
          "kickstart_rom_file=/" + kickstartFileName,
          "floppy0=/" + gameFileName,
          "floppy0type=0",
          "floppy_speed=100",
          "nr_floppies=1",
          "joyport0=mouse",
          "joyport1=joy1",
          "gfx_framerate=1",
        ].join("\n");

        return fileFromBytes(
          "oldstylegaming-aga.uae",
          new TextEncoder().encode(`${config}\n`),
          "text/plain"
        );
      }

      function buildEmulatorFiles() {
        clearObjectUrls();

        if (!pendingKickstart) {
          return {
            gameFile: fileFromBytes(
              safeVirtualFileName(pendingGame.fileName, "game.adf"),
              pendingGame.bytes
            ),
            biosFile: "",
            externalFiles: {},
          };
        }

        const kickstartFileName = safeVirtualFileName(
          puaeKickstartName(pendingKickstart.fileName),
          "kick40068.A1200"
        );

        const biosFile = fileFromBytes(kickstartFileName, pendingKickstart.bytes);
        const biosObjectUrl = createTrackedObjectUrl(biosFile);

        const externalFiles = {
          [`/${kickstartFileName}`]: biosObjectUrl,
        };

        PUAE_SYSTEM_DIRS.forEach((dir) => {
          externalFiles[`${dir}/${kickstartFileName}`] = biosObjectUrl;
        });

        const disksToLoad = pendingDisks.length
          ? pendingDisks
          : [
              {
                fileName: pendingGame.fileName || "game.adf",
                bytes: pendingGame.bytes,
              },
            ];

        const diskFileNames = disksToLoad.map((disk, index) => {
          const extension = extensionForFileName(disk.fileName);
          const diskFileName = `oldstylegaming-aga-disk-${index + 1}.${extension}`;
          return diskFileName;
        });

        if (diskFileNames.length > 1) {
          const m3uName = "oldstylegaming-aga.m3u";
          const m3uBytes = new TextEncoder().encode(`${diskFileNames.join("\n")}\n`);
          const zipFile = buildZipFile([
            { fileName: m3uName, bytes: m3uBytes },
            ...disksToLoad.map((disk, index) => ({
              fileName: diskFileNames[index],
              bytes: disk.bytes,
            })),
          ], "oldstylegaming-aga-multidisk.zip");

          return {
            gameFile: zipFile,
            biosFile,
            externalFiles,
          };
        }

        const diskFile = fileFromBytes(diskFileNames[0], disksToLoad[0].bytes);
        const diskObjectUrl = createTrackedObjectUrl(diskFile);
        externalFiles[`/${diskFileNames[0]}`] = diskObjectUrl;

        return {
          gameFile: buildPuaeConfigFile(diskFileNames[0], kickstartFileName),
          biosFile,
          externalFiles,
        };
      }

      function switchToNextDisk() {
        const manager = window.EJS_emulator?.gameManager;

        if (!manager || !window.EJS_emulator?.started) {
          setStatus("Emulator is not ready for disk swapping yet");
          return;
        }

        const diskCount = manager.getDiskCount?.() || 0;
        if (diskCount < 2) {
          setStatus("Load all disks for the game together before starting");
          window.EJS_emulator?.displayMessage?.("No extra disks loaded");
          return;
        }

        const currentDisk = manager.getCurrentDisk?.() || 0;
        const nextDisk = (currentDisk + 1) % diskCount;
        manager.setCurrentDisk(nextDisk);
        setStatus(`Swapped to disk ${nextDisk + 1}`);
        window.EJS_emulator?.displayMessage?.(`Disk ${nextDisk + 1}`);
      }

      function simulateInput(player, button, value) {
        const manager = window.EJS_emulator?.gameManager;

        if (!manager || !window.EJS_emulator?.started) return;

        manager.simulateInput(player, button, value);
      }

      function getEmulatorTarget() {
        return (
          window.EJS_emulator?.canvas ||
          window.EJS_emulator?.game ||
          window.EJS_emulator?.elements?.parent ||
          gameElement
        );
      }

      function dispatchMouseEvent(type, button = 0, buttons = 0, movementX = 0, movementY = 0) {
        const target = getEmulatorTarget();

        mouseX = Math.max(0, Math.min(window.innerWidth, mouseX + movementX));
        mouseY = Math.max(0, Math.min(window.innerHeight, mouseY + movementY));

        const event = new MouseEvent(type, {
          bubbles: true,
          cancelable: true,
          button,
          buttons,
          clientX: mouseX || window.innerWidth / 2,
          clientY: mouseY || window.innerHeight / 2,
          movementX,
          movementY,
        });

        Object.defineProperty(event, "movementX", { get: () => movementX });
        Object.defineProperty(event, "movementY", { get: () => movementY });

        target?.dispatchEvent(event);
        if (target !== document) {
          document.dispatchEvent(event);
        }
      }

      function applyJoystickMask(mask) {
        joystickMask = mask || 0;

        simulateInput(0, 4, joystickMask & 1 ? 1 : 0);
        simulateInput(0, 5, joystickMask & 2 ? 1 : 0);
        simulateInput(0, 6, joystickMask & 4 ? 1 : 0);
        simulateInput(0, 7, joystickMask & 8 ? 1 : 0);
        simulateInput(0, 0, joystickMask & 16 ? 1 : 0);
        simulateInput(0, 8, joystickMask & 32 ? 1 : 0);
        simulateInput(0, 3, joystickMask & 64 ? 1 : 0);
      }

      function pulseInput(button) {
        simulateInput(0, button, 1);
        window.setTimeout(() => {
          simulateInput(0, button, 0);
        }, 80);
      }

      function applyMouseButton(button, action) {
        const isRight = button === 3;
        const inputButton = isRight ? 8 : 0;
        const domButton = isRight ? 2 : 0;
        const domButtons = isRight ? 2 : 1;

        if (action === "down") {
          simulateInput(0, inputButton, 1);
          dispatchMouseEvent("mousedown", domButton, domButtons);
          return;
        }

        if (action === "up") {
          simulateInput(0, inputButton, 0);
          dispatchMouseEvent("mouseup", domButton, 0);
          dispatchMouseEvent("click", domButton, 0);
          return;
        }

        pulseInput(inputButton);
        dispatchMouseEvent("mousedown", domButton, domButtons);
        window.setTimeout(() => {
          dispatchMouseEvent("mouseup", domButton, 0);
          dispatchMouseEvent("click", domButton, 0);
        }, 80);
      }

      function applyMouseMove(dx, dy) {
        const movementX = Math.max(-80, Math.min(80, Number(dx) || 0));
        const movementY = Math.max(-80, Math.min(80, Number(dy) || 0));

        if (!movementX && !movementY) return;

        dispatchMouseEvent("mousemove", 0, 0, movementX, movementY);

        const xIndex = movementX > 0 ? 16 : 17;
        const yIndex = movementY > 0 ? 18 : 19;
        const xValue = Math.min(0x7fff, Math.abs(movementX) * 1200);
        const yValue = Math.min(0x7fff, Math.abs(movementY) * 1200);

        if (movementX) {
          simulateInput(0, xIndex, xValue);
          simulateInput(0, movementX > 0 ? 17 : 16, 0);
        }

        if (movementY) {
          simulateInput(0, yIndex, yValue);
          simulateInput(0, movementY > 0 ? 19 : 18, 0);
        }

        window.setTimeout(() => {
          simulateInput(0, 16, 0);
          simulateInput(0, 17, 0);
          simulateInput(0, 18, 0);
          simulateInput(0, 19, 0);
        }, 16);
      }

      function keyEventType(action) {
        return action === "up" ? "keyup" : "keydown";
      }

      function keyCodeFor(code, key) {
        if (code === "ArrowUp") return 38;
        if (code === "ArrowDown") return 40;
        if (code === "ArrowLeft") return 37;
        if (code === "ArrowRight") return 39;
        if (code === "Enter") return 13;
        if (code === "Space") return 32;
        if (code === "Tab") return 9;
        if (code?.startsWith("Key")) return code.charCodeAt(3);
        if (code?.startsWith("Digit")) return code.charCodeAt(5);
        if (key && key.length === 1) return key.toUpperCase().charCodeAt(0);
        return 0;
      }

      function dispatchKeyboardInput(code, key, action) {
        if (!code) return;

        const type = keyEventType(action);
        const keyCode = keyCodeFor(code, key);
        const eventInit = {
          key: key || (code.startsWith("Key") ? code.slice(3).toLowerCase() : code),
          code,
          keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true,
        };
        const target = window.EJS_emulator?.elements?.parent || gameElement;
        const targetEvent = new KeyboardEvent(type, eventInit);
        const documentEvent = new KeyboardEvent(type, eventInit);

        Object.defineProperty(targetEvent, "keyCode", { get: () => keyCode });
        Object.defineProperty(targetEvent, "which", { get: () => keyCode });
        Object.defineProperty(documentEvent, "keyCode", { get: () => keyCode });
        Object.defineProperty(documentEvent, "which", { get: () => keyCode });

        target.focus?.();
        target.dispatchEvent(targetEvent);
        document.dispatchEvent(documentEvent);
      }

      function startEmulator() {
        if (started) return;

        if (!pendingGame) {
          setStatus("Choose an Amiga AGA file first");
          return;
        }

        started = true;
        statusElement.style.display = "none";
        gameElement.innerHTML = "";

        const emulatorFiles = buildEmulatorFiles();

        window.EJS_player = "#game";
        window.EJS_core = "puae";
        window.EJS_gameName = pendingGame.fileName || "Amiga AGA";
        window.EJS_gameUrl = emulatorFiles.gameFile;
        window.EJS_biosUrl = emulatorFiles.biosFile;
        window.EJS_externalFiles = emulatorFiles.externalFiles;
        window.EJS_pathtodata = "/emulatorjs/data/";
        window.EJS_DEBUG_XX = true;
        window.EJS_startOnLoaded = true;
        window.EJS_disableAutoLang = true;
        window.EJS_threads = false;
        window.EJS_defaultOptions = {
          "puae_model": "A1200",
          "puae_chipset": "AGA",
          "puae_cpu_model": "68020",
          "puae_chipmem_size": "4",
          "puae_fastmem_size": "8",
        };

        const script = document.createElement("script");
        script.src = "/emulatorjs/data/loader.js";
        document.body.appendChild(script);
      }

      window.getAmigaAgaAudioStream = () => null;

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data || {};

        if (data.type === "amiga_aga_start") {
          startEmulator();
        }

        if (data.type === "amiga_aga_autoload") {
          const disks = Array.isArray(data.disks) ? data.disks : [];

          pendingDisks = disks.map((disk, index) => ({
            fileName: disk.fileName || `disk-${index + 1}.adf`,
            bytes: new Uint8Array(disk.bytes || []),
          })).filter((disk) => disk.bytes.length);

          pendingGame = {
            fileName: pendingDisks[0]?.fileName || data.fileName || "game.uae",
            bytes: pendingDisks[0]?.bytes || new Uint8Array(data.bytes || []),
          };

          setStatus(`Starting ${pendingGame.fileName} with PUAE...`);
          startEmulator();
        }

        if (data.type === "amiga_kickstart") {
          pendingKickstart = {
            fileName: data.fileName || "kick.rom",
            bytes: new Uint8Array(data.bytes || []),
          };
          setStatus(`Kickstart ready: ${pendingKickstart.fileName}`);
        }

        if (data.type === "amiga_aga_next_disk") {
          switchToNextDisk();
        }

        if (data.type === "amiga_aga_reset") {
          window.location.reload();
        }

        if (data.type === "amstrad_remote_joystick" || data.type === "joystick") {
          applyJoystickMask(Number(data.mask) || 0);
        }

        if (data.type === "amiga_mouse_button") {
          applyMouseButton(data.button, data.action);
        }

        if (data.type === "amiga_mouse_move") {
          applyMouseMove(data.movementX, data.movementY);
        }

        if (data.type === "amiga_keyboard") {
          dispatchKeyboardInput(data.code, data.key, data.action);
        }
      });
    </script>
  </body>
</html>
