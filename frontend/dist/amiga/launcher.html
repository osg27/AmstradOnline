<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amiga Emulator</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #f6f1e7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #amiga-root,
      #amiga-player,
      #player_container {
        width: 100%;
        height: 100%;
      }

      #amiga-player {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }

      #amiga-player > div,
      #vAmigaWeb {
        width: 100% !important;
        height: 100% !important;
      }

      #vAmigaWeb {
        border: 0;
        display: block;
      }

      .amiga-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #050606;
      }

      .amiga-status strong {
        display: block;
        margin-bottom: 8px;
        font-size: 18px;
      }

      .amiga-status p {
        margin: 0;
        color: #b9b2a4;
      }

      #placeholder-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="amiga-root">
      <canvas id="placeholder-canvas" data-ignore-capture="true" width="724" height="568"></canvas>
      <div id="amiga-player"></div>
    </div>
    <script src="js/vAmigaWeb_player.js"></script>
    <script src="launcher.js?v=2026-06-07-6"></script>
  </body>
</html>
