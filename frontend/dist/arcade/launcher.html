<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAME Arcade Launcher</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      #arcade-screen {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: block;
        width: 640px;
        height: 480px;
        max-width: 100vw;
        max-height: 100vh;
        margin: auto;
        background: #000;
        image-rendering: pixelated;
      }

      #arcade-status {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 32px;
        text-align: center;
        background: #000;
        pointer-events: none;
      }

      #arcade-status.hidden {
        display: none;
      }

      #arcade-status strong {
        font-size: 34px;
        line-height: 1.1;
      }

      #arcade-status span {
        max-width: 620px;
        color: #bcc4cf;
        font-size: 22px;
        line-height: 1.3;
      }

      #mame-container {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      #mame-container iframe,
      #mame-container canvas {
        width: 100% !important;
        height: 100% !important;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="arcade-screen" class="emscripten" width="640" height="480" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="arcade-status">
      <strong>MAME ready</strong>
      <span>Load a MAME ROM zip from the room</span>
    </div>
    <div id="mame-container"></div>
    <script src="./launcher.js?v=2026-06-04-7"></script>
  </body>
</html>
