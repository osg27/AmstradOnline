<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NES Launcher</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;

      canvas {

        background: #000;
      }

  </head>

    <canvas id="screen" width="256" height="240"></canvas>
    <script src="./jsnes.min.js?v=2026-06-18-1"></script>
