<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNES Launcher</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      #snes-screen {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
        image-rendering: pixelated;
      }

      #game {
        position: absolute;
        left: -10000px;
        top: -10000px;
        width: 640px;
        height: 480px;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="snes-screen" width="640" height="480"></canvas>
    <div id="game"></div>
    <script src="./launcher.js?v=2026-06-01-1"></script>
  </body>
</html>
