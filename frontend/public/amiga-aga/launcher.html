<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amiga AGA Launcher</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #efeae0;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        background: #050606;
        color: #86e6bd;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="768" height="576" tabindex="0"></canvas>
    <div id="status">Load an Amiga AGA file to start PUAE</div>

    <script src="/puae-wasm/puae_libretro.js"></script>
    <script>
      const statusElement = document.getElementById("status");
      const gameElement = document.getElementById("game");
      const encoder = new TextEncoder();
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      const PUAE_SYSTEM_DIRS = [
        "/home/web_user/retroarch/userdata/system",
        "/home/web_user/.config/retroarch/system",
        "/system",
      ];
      const CORE_OPTIONS = [
        'puae_model = "A1200"',
        'puae_model_fd = "A1200"',
        'puae_kickstart = "kick40068.A1200"',
        'puae_chipset = "AGA"',
        'puae_cpu_model = "68020"',
        'puae_chipmem_size = "4"',
        'puae_fastmem_size = "8"',
        'puae_floppy_multidrive = "disabled"',
        'puae_physical_keyboard_pass_through = "enabled"',
      ].join("\n");

      let pendingGame = null;
      let pendingDisks = [];
      let pendingKickstart = null;
      let started = false;
      let runtimeModule = null;
      let getDiskCount = null;
      let getCurrentDisk = null;
      let setCurrentDisk = null;
      let simulateRuntimeInput = null;
      let setKeyboardEnabled = null;
      let audioCaptureStream = null;
      let capturedAudioContext = null;
      const joystickMasks = [0, 0];
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      if (NativeAudioContext) {
        capturedAudioContext = new NativeAudioContext();
        const captureDestination = capturedAudioContext.createMediaStreamDestination();
        const nativeCreateBufferSource = capturedAudioContext.createBufferSource.bind(capturedAudioContext);
        audioCaptureStream = captureDestination.stream;

        capturedAudioContext.createBufferSource = () => {
          const source = nativeCreateBufferSource();
          const nativeConnect = source.connect.bind(source);
          source.connect = (destination, ...connectArgs) => {
            const result = nativeConnect(destination, ...connectArgs);
            if (destination === capturedAudioContext.destination) {
              try {
                nativeConnect(captureDestination);
              } catch {
                // The source was already connected to the capture stream.
              }
            }
            return result;
          };
          return source;
        };

        function CapturedAudioContext(...args) {
          return capturedAudioContext;
        }

        CapturedAudioContext.prototype = NativeAudioContext.prototype;
        window.AudioContext = CapturedAudioContext;
        window.webkitAudioContext = CapturedAudioContext;
        gameElement.addEventListener("click", () => capturedAudioContext.resume());
      }

      function setStatus(message) {
        statusElement.style.display = "grid";
        statusElement.textContent = message;
      }

      function safeExtension(fileName) {
        return (fileName || "").toLowerCase().match(/\.([a-z0-9]+)$/)?.[1] || "adf";
      }

      function mkdirp(path) {
        let current = "";
        path.split("/").filter(Boolean).forEach((part) => {
          current += `/${part}`;
          try {
            runtimeModule.FS.mkdir(current);
          } catch {
            // Directory already exists.
          }
        });
      }

      function writeRuntimeFile(path, bytes) {
        mkdirp(path.split("/").slice(0, -1).join("/"));
        runtimeModule.FS.writeFile(path, bytes);
      }

      function installRuntimeFiles() {
        PUAE_SYSTEM_DIRS.forEach((dir) => {
          writeRuntimeFile(`${dir}/kick40068.A1200`, pendingKickstart.bytes);
        });

        const disks = pendingDisks.length
          ? pendingDisks
          : [{ fileName: pendingGame.fileName || "game.adf", bytes: pendingGame.bytes }];
        const diskPaths = disks.map((disk, index) => {
          const path = `/disks/disk-${index + 1}.${safeExtension(disk.fileName)}`;
          writeRuntimeFile(path, disk.bytes);
          return path;
        });

        writeRuntimeFile("/game.m3u", encoder.encode(`${diskPaths.join("\n")}\n`));
        writeRuntimeFile(
          "/home/web_user/.config/retroarch/retroarch.cfg",
          encoder.encode([
            'system_directory = "/home/web_user/retroarch/userdata/system"',
            'core_options_path = "/home/web_user/retroarch/userdata/config/retroarch-core-options.cfg"',
            "video_vsync = true",
            "video_smooth = false",
            "audio_latency = 64",
          ].join("\n"))
        );
        writeRuntimeFile(
          "/home/web_user/retroarch/userdata/config/retroarch-core-options.cfg",
          encoder.encode(CORE_OPTIONS)
        );
      }

      function switchToNextDisk() {
        if (!getDiskCount || !getCurrentDisk || !setCurrentDisk) {
          setStatus("Emulator is not ready for disk swapping yet");
          return;
        }

        const count = getDiskCount();
        if (count < 2) {
          setStatus("Load all disks for the game together before starting");
          return;
        }

        const next = (getCurrentDisk() + 1) % count;
        setCurrentDisk(next);
        setStatus(`Swapped to disk ${next + 1} of ${count}`);
        window.setTimeout(() => {
          statusElement.style.display = "none";
        }, 1200);
      }

      function simulateInput(player, button, value) {
        simulateRuntimeInput?.(player, button, value);
      }

      function dispatchMouseEvent(type, button = 0, buttons = 0, movementX = 0, movementY = 0) {
        mouseX = Math.max(0, Math.min(window.innerWidth, mouseX + movementX));
        mouseY = Math.max(0, Math.min(window.innerHeight, mouseY + movementY));

        const event = new MouseEvent(type, {
          bubbles: true,
          cancelable: true,
          button,
          buttons,
          clientX: mouseX,
          clientY: mouseY,
          movementX,
          movementY,
        });
        Object.defineProperty(event, "movementX", { get: () => movementX });
        Object.defineProperty(event, "movementY", { get: () => movementY });
        gameElement.dispatchEvent(event);
        document.dispatchEvent(event);
      }

      function applyJoystickMask(player, mask) {
        const runtimePlayer = Number(player) === 2 ? 1 : 0;
        const joystickMask = Number(mask) || 0;
        joystickMasks[runtimePlayer] = joystickMask;
        simulateInput(runtimePlayer, 4, joystickMask & 1 ? 1 : 0);
        simulateInput(runtimePlayer, 5, joystickMask & 2 ? 1 : 0);
        simulateInput(runtimePlayer, 6, joystickMask & 4 ? 1 : 0);
        simulateInput(runtimePlayer, 7, joystickMask & 8 ? 1 : 0);
        simulateInput(runtimePlayer, 0, joystickMask & 16 ? 1 : 0);
        simulateInput(runtimePlayer, 8, joystickMask & 32 ? 1 : 0);
        simulateInput(runtimePlayer, 3, joystickMask & 64 ? 1 : 0);
      }

      function pulseInput(button) {
        simulateInput(0, button, 1);
        window.setTimeout(() => simulateInput(0, button, 0), 80);
      }

      function applyMouseButton(button, action) {
        const isRight = button === 3;
        const inputButton = isRight ? 8 : 0;
        const domButton = isRight ? 2 : 0;
        const domButtons = isRight ? 2 : 1;

        if (action === "down") {
          simulateInput(0, inputButton, 1);
          dispatchMouseEvent("mousedown", domButton, domButtons);
        } else if (action === "up") {
          simulateInput(0, inputButton, 0);
          dispatchMouseEvent("mouseup", domButton, 0);
          dispatchMouseEvent("click", domButton, 0);
        } else {
          pulseInput(inputButton);
          dispatchMouseEvent("mousedown", domButton, domButtons);
          window.setTimeout(() => {
            dispatchMouseEvent("mouseup", domButton, 0);
            dispatchMouseEvent("click", domButton, 0);
          }, 80);
        }
      }

      function applyMouseMove(dx, dy) {
        const movementX = Math.max(-80, Math.min(80, Number(dx) || 0));
        const movementY = Math.max(-80, Math.min(80, Number(dy) || 0));
        if (!movementX && !movementY) return;

        dispatchMouseEvent("mousemove", 0, 0, movementX, movementY);
        if (movementX) {
          simulateInput(0, movementX > 0 ? 16 : 17, Math.min(0x7fff, Math.abs(movementX) * 1200));
          simulateInput(0, movementX > 0 ? 17 : 16, 0);
        }
        if (movementY) {
          simulateInput(0, movementY > 0 ? 18 : 19, Math.min(0x7fff, Math.abs(movementY) * 1200));
          simulateInput(0, movementY > 0 ? 19 : 18, 0);
        }
        window.setTimeout(() => {
          [16, 17, 18, 19].forEach((index) => simulateInput(0, index, 0));
        }, 16);
      }

      function keyCodeFor(code, key) {
        const known = { ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39, Enter: 13, Space: 32, Tab: 9 };
        if (known[code]) return known[code];
        if (code?.startsWith("Key")) return code.charCodeAt(3);
        if (code?.startsWith("Digit")) return code.charCodeAt(5);
        return key?.length === 1 ? key.toUpperCase().charCodeAt(0) : 0;
      }

      function dispatchKeyboardInput(code, key, action) {
        if (!code) return;
        const type = action === "up" ? "keyup" : "keydown";
        const keyCode = keyCodeFor(code, key);
        const init = { key: key || code, code, keyCode, which: keyCode, bubbles: true, cancelable: true };
        const canvasEvent = new KeyboardEvent(type, init);
        const documentEvent = new KeyboardEvent(type, init);
        const windowEvent = new KeyboardEvent(type, init);
        [canvasEvent, documentEvent, windowEvent].forEach((event) => {
          Object.defineProperty(event, "keyCode", { get: () => keyCode });
          Object.defineProperty(event, "which", { get: () => keyCode });
        });
        gameElement.focus();
        gameElement.dispatchEvent(canvasEvent);
        document.dispatchEvent(documentEvent);
        window.dispatchEvent(windowEvent);
      }

      async function startEmulator() {
        if (started) return;
        if (!pendingGame) {
          setStatus("Choose an Amiga AGA file first");
          return;
        }
        if (!pendingKickstart?.bytes?.length) {
          setStatus("Waiting for your A1200 Kickstart ROM...");
          return;
        }
        if (typeof window.EJS_Runtime !== "function") {
          setStatus("Dedicated PUAE runtime did not load");
          return;
        }

        started = true;
        setStatus(`Starting ${pendingGame.fileName} with dedicated PUAE...`);

        try {
          runtimeModule = await window.EJS_Runtime({
            noInitialRun: true,
            arguments: [],
            preRun: [],
            postRun: [],
            canvas: gameElement,
            callbacks: {
              setupCoreSettingFile: (path) => writeRuntimeFile(path, encoder.encode(CORE_OPTIONS)),
            },
            parent: document.body,
            print: (message) => console.log(message),
            printErr: (message) => console.error(message),
            locateFile: (fileName) => fileName.endsWith(".wasm") ? "/puae-wasm/puae_libretro.wasm" : fileName,
            getSavExt: () => ".nvr",
          });

          installRuntimeFiles();
          getDiskCount = runtimeModule.cwrap("get_disk_count", "number", []);
          getCurrentDisk = runtimeModule.cwrap("get_current_disk", "number", []);
          setCurrentDisk = runtimeModule.cwrap("set_current_disk", null, ["number"]);
          simulateRuntimeInput = runtimeModule.cwrap("simulate_input", null, ["number", "number", "number"]);
          setKeyboardEnabled = runtimeModule.cwrap("ejs_set_keyboard_enabled", null, ["number"]);
          setKeyboardEnabled(1);
          runtimeModule.callMain(["/game.m3u"]);
          runtimeModule.resumeMainLoop?.();
          gameElement.focus();
          statusElement.style.display = "none";
        } catch (error) {
          started = false;
          console.error(error);
          setStatus(`PUAE failed to start: ${error.message}`);
        }
      }

      window.getAmigaAgaAudioStream = () => audioCaptureStream;

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data || {};

        if (data.type === "amiga_aga_start") startEmulator();

        if (data.type === "amiga_aga_autoload") {
          const disks = Array.isArray(data.disks) ? data.disks : [];
          pendingDisks = disks.map((disk, index) => ({
            fileName: disk.fileName || `disk-${index + 1}.adf`,
            bytes: new Uint8Array(disk.bytes || []),
          })).filter((disk) => disk.bytes.length);
          pendingGame = {
            fileName: pendingDisks[0]?.fileName || data.fileName || "game.adf",
            bytes: pendingDisks[0]?.bytes || new Uint8Array(data.bytes || []),
          };
          startEmulator();
        }

        if (data.type === "amiga_kickstart") {
          pendingKickstart = {
            fileName: data.fileName || "kick.rom",
            bytes: new Uint8Array(data.bytes || []),
          };
          setStatus(`Kickstart ready: ${pendingKickstart.fileName}`);
          if (pendingGame && !started) startEmulator();
        }

        if (data.type === "amiga_aga_next_disk") switchToNextDisk();
        if (data.type === "amiga_aga_reset") window.location.reload();
        if (data.type === "amstrad_audio_unlock") capturedAudioContext?.resume();
        if (data.type === "amstrad_remote_joystick" || data.type === "joystick") {
          applyJoystickMask(data.player, data.mask);
        }
        if (data.type === "amiga_mouse_button") applyMouseButton(data.button, data.action);
        if (data.type === "amiga_mouse_move") applyMouseMove(data.movementX, data.movementY);
        if (data.type === "amiga_keyboard") dispatchKeyboardInput(data.code, data.key, data.action);
      });
    </script>
  </body>
</html>
