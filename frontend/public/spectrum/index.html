<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old Style Gaming - ZX Spectrum</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        background: #000;
      }

      #speccy {
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #speccy > * {
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="speccy"></div>
    <script src="./jsspeccy.js"></script>
    <script src="./main.js?v=2026-06-30-3"></script>
  </body>
</html>
