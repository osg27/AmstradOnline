<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharp X68000 Launcher</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }
      #pcengine-screen { position: absolute; inset: 0; z-index: 2; display: block; width: 100vw; height: 100vh; background: #000; image-rendering: pixelated; pointer-events: none; }
      #game { position: absolute; inset: 0; z-index: 1; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
      #game canvas, #game .ejs_game, #game .ejs_canvas, #game .ejs_container { max-width: 100% !important; max-height: 100% !important; }
    </style>
  </head>
  <body>
    <canvas id="pcengine-screen" width="768" height="512"></canvas>
    <div id="game"></div>
    <script src="/pcengine/launcher.js?v=2026-08-05-5"></script>
  </body>
</html>
