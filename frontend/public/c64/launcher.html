<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Commodore 64</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <iframe
      id="c64-frame"
      src="./c64.html"
      allow="autoplay; fullscreen; gamepad"
    ></iframe>

    <script>
      const frame = document.getElementById("c64-frame");

      function focusC64() {
        frame.focus();
        try {
          frame.contentWindow.focus();
        } catch {}
      }

      function sendKeyToC64(key, code, action) {
        focusC64();

        const type = action === "up" ? "keyup" : "keydown";

        const event = new KeyboardEvent(type, {
          key: key || code || "",
          code: code || key || "",
          bubbles: true,
          cancelable: true,
        });

        try {
          frame.contentWindow.dispatchEvent(event);
          frame.contentDocument?.dispatchEvent(event);
          frame.contentDocument?.body?.dispatchEvent(event);
        } catch {}
      }

      window.addEventListener("click", focusC64);
      window.addEventListener("pointerdown", focusC64);

      window.addEventListener("keydown", (event) => {
        sendKeyToC64(event.key, event.code, "down");
      });

      window.addEventListener("keyup", (event) => {
        sendKeyToC64(event.key, event.code, "up");
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;

        const message = event.data || {};

        if (message.type === "c64_start" || message.type === "amstrad_audio_unlock") {
          focusC64();
          return;
        }

        if (message.type === "c64_reset") {
          location.reload();
          return;
        }

        if (message.type === "amstrad_remote_input" || message.type === "amstrad_remote_control") {
          sendKeyToC64(message.key, message.code, message.action);
          return;
        }

        if (message.type === "amstrad_remote_joystick") {
          // Basic joystick-to-keyboard fallback.
          // mask bits are usually: up/down/left/right/fire depending on your existing mapping.
          const mask = Number(message.mask || 0);

          const keys = [
            { bit: 1, key: "ArrowUp", code: "ArrowUp" },
            { bit: 2, key: "ArrowDown", code: "ArrowDown" },
            { bit: 4, key: "ArrowLeft", code: "ArrowLeft" },
            { bit: 8, key: "ArrowRight", code: "ArrowRight" },
            { bit: 16, key: " ", code: "Space" },
          ];

          for (const item of keys) {
            sendKeyToC64(
              item.key,
              item.code,
              mask & item.bit ? "down" : "up"
            );
          }
        }

        if (message.type === "c64_autoload") {
          console.warn("Tiny8Bit C64 does not support the old VICE c64_autoload message yet.");
        }
      });
    </script>
  </body>
</html>
